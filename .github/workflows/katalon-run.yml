name: Katalon Test Run

on:
  repository_dispatch:
    types: [katalon-test-run]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Show payload
        run: |
          echo "Project: ${{ github.event.client_payload.project_name }}"
          echo "Download URL: ${{ github.event.client_payload.download_url }}"

      - name: Download Katalon Project
        run: |
          echo "Downloading Katalon project..."
          curl -L -o project.zip "${{ github.event.client_payload.download_url }}"
          
          # Cek apakah valid zip
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "ERROR: Invalid zip file"
            cat project.zip
            exit 1
          fi
          
          unzip -q project.zip -d katalon-project
          echo "Project extracted"

      - name: Count Test Cases
        id: count
        run: |
          # Hitung file .groovy di Scripts/
          if [ -d "katalon-project/Scripts" ]; then
            COUNT=$(find katalon-project/Scripts -name "*.groovy" | wc -l)
            echo "Found $COUNT test scripts"
            echo "TOTAL=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "No Scripts folder found"
            echo "TOTAL=0" >> $GITHUB_OUTPUT
          fi

      - name: Simulate Test Execution
        id: test
        run: |
          TOTAL=${{ steps.count.outputs.TOTAL }}
          
          if [ "$TOTAL" -eq "0" ]; then
            echo "No test cases to run"
            echo "STATUS=failed" >> $GITHUB_OUTPUT
            echo "PASSED=0" >> $GITHUB_OUTPUT
            echo "FAILED=0" >> $GITHUB_OUTPUT
          else
            echo "Simulating execution of $TOTAL tests..."
            sleep 2
            echo "STATUS=passed" >> $GITHUB_OUTPUT
            echo "PASSED=$TOTAL" >> $GITHUB_OUTPUT
            echo "FAILED=0" >> $GITHUB_OUTPUT
          fi

      - name: Report Results
        if: always()
        run: |
          STATUS="${{ steps.test.outputs.STATUS }}"
          TOTAL="${{ steps.count.outputs.TOTAL }}"
          PASSED="${{ steps.test.outputs.PASSED }}"
          FAILED="${{ steps.test.outputs.FAILED }}"
          
          # Fallback jika step sebelumnya gagal
          if [ -z "$STATUS" ]; then
            STATUS="failed"
            TOTAL=0
            PASSED=0
            FAILED=0
          fi
          
          echo "Sending callback: $STATUS, $PASSED/$TOTAL passed"
          
          curl -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"${STATUS}\",
              \"total_tests\": ${TOTAL},
              \"passed\": ${PASSED},
              \"failed\": ${FAILED},
              \"skipped\": 0,
              \"results\": []
            }"
          
          echo "Callback sent!"
