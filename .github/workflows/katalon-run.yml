name: Katalon Test Run

on:
  repository_dispatch:
    types: [katalon-test-run]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Show payload
        run: |
          echo "=== Received Payload ==="
          echo "Project ID: ${{ github.event.client_payload.project_id }}"
          echo "Project Name: ${{ github.event.client_payload.project_name }}"
          echo "Base URL: ${{ github.event.client_payload.base_url }}"
          echo "Browser: ${{ github.event.client_payload.browser_type }}"
          echo "Download URL: ${{ github.event.client_payload.download_url }}"
          echo "Test Run ID: ${{ github.event.client_payload.test_run_id }}"

      - name: Download Katalon Project
        run: |
          echo "Downloading project..."
          curl -L -o project.zip "${{ github.event.client_payload.download_url }}"
          unzip -q project.zip -d katalon-project
          echo "Project downloaded and extracted"
          ls -la katalon-project/

      - name: Simulate Test Run (Mock)
        id: test_run
        run: |
          echo "Simulating Katalon test execution..."
          echo "This would normally run: katalonc -projectPath=katalon-project ..."
          
          # Simulasi test berjalan
          sleep 3
          
          # Mock hasil test
          echo "TEST_RESULT=passed" >> $GITHUB_OUTPUT
          echo "TOTAL=5" >> $GITHUB_OUTPUT
          echo "PASSED=5" >> $GITHUB_OUTPUT
          echo "FAILED=0" >> $GITHUB_OUTPUT
          echo "SKIPPED=0" >> $GITHUB_OUTPUT
          
          echo " Mock test completed successfully"

      - name: Report Results to Supabase
        if: always()
        run: |
          echo "Sending callback to Supabase..."
          
          # Tentukan status berdasarkan job
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="passed"
            PASSED="${{ steps.test_run.outputs.PASSED }}"
            FAILED="${{ steps.test_run.outputs.FAILED }}"
            TOTAL="${{ steps.test_run.outputs.TOTAL }}"
          else
            STATUS="failed"
            PASSED="0"
            FAILED="1"
            TOTAL="1"
          fi
          
          # Kirim callback
          RESPONSE=$(curl -w "\n%{http_code}" -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"${STATUS}\",
              \"total_tests\": ${TOTAL},
              \"passed\": ${PASSED},
              \"failed\": ${FAILED},
              \"skipped\": 0,
              \"results\": [
                {\"tc_code\": \"ST_TC_001\", \"status\": \"passed\", \"duration_ms\": 1200},
                {\"tc_code\": \"ST_TC_002\", \"status\": \"passed\", \"duration_ms\": 1500},
                {\"tc_code\": \"ST_TC_003\", \"status\": \"passed\", \"duration_ms\": 980},
                {\"tc_code\": \"ST_TC_004\", \"status\": \"passed\", \"duration_ms\": 1100},
                {\"tc_code\": \"ST_TC_005\", \"status\": \"passed\", \"duration_ms\": 1350}
              ]
            }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo " Callback sent successfully!"
          else
            echo " Callback failed with status $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi
