name: Katalon Test Run

on:
  repository_dispatch:
    types: [katalon-test-run]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Show Payload
        run: |
          echo "Project: ${{ github.event.client_payload.project_name }}"
          echo "Project ID: ${{ github.event.client_payload.project_id }}"

      - name: Download Katalon Project Data
        id: download
        run: |
          echo "Downloading project data..."
          
          curl -f -o project.json "${{ github.event.client_payload.download_url }}"
          
          if [ $? -ne 0 ]; then
            echo "ERROR: Download failed"
            cat project.json || echo "No response file"
            exit 1
          fi
          
          echo "Project data downloaded"
          
          # Parse test count
          TEST_COUNT=$(jq '.scripts | length' project.json)
          echo "Found $TEST_COUNT test script(s)"
          echo "TEST_COUNT=$TEST_COUNT" >> $GITHUB_OUTPUT
          
          # Show first script for debugging
          echo "First script:"
          jq -r '.scripts[0].tc_code' project.json || echo "No scripts"

      - name: Build Katalon Project Structure
        run: |
          echo "Building Katalon project structure..."
          mkdir -p katalon-project/{Scripts,Profiles,"Object Repository","Test Suites"}
          
          # Extract scripts from JSON
          jq -r '.scripts[] | "\(.file_path)\n---CONTENT---\n\(.content)\n---END---"' project.json | while IFS= read -r line; do
            if [[ "$line" == "---CONTENT---" ]]; then
              reading_content=true
              content=""
              continue
            fi
            if [[ "$line" == "---END---" ]]; then
              echo "$content" > "katalon-project/$filepath"
              reading_content=false
              continue
            fi
            if [[ "$reading_content" == true ]]; then
              content+="$line"$'\n'
            else
              filepath="$line"
              mkdir -p "katalon-project/$(dirname "$filepath")"
            fi
          done
          
          echo "Project structure built"
          ls -la katalon-project/

      - name: Simulate Test Execution
        id: test
        run: |
          TEST_COUNT=${{ steps.download.outputs.TEST_COUNT }}
          
          echo "Simulating execution of $TEST_COUNT test(s)..."
          sleep 2
          
          if [ "$TEST_COUNT" -gt 0 ]; then
            echo "STATUS=passed" >> $GITHUB_OUTPUT
            echo "PASSED=$TEST_COUNT" >> $GITHUB_OUTPUT
            echo "FAILED=0" >> $GITHUB_OUTPUT
          else
            echo "STATUS=failed" >> $GITHUB_OUTPUT
            echo "PASSED=0" >> $GITHUB_OUTPUT
            echo "FAILED=0" >> $GITHUB_OUTPUT
          fi

      - name: Report Results to Supabase
        if: always()
        run: |
          STATUS="${{ steps.test.outputs.STATUS }}"
          PASSED="${{ steps.test.outputs.PASSED }}"
          FAILED="${{ steps.test.outputs.FAILED }}"
          TEST_COUNT="${{ steps.download.outputs.TEST_COUNT }}"
          
          # Fallback values
          STATUS="${STATUS:-failed}"
          PASSED="${PASSED:-0}"
          FAILED="${FAILED:-0}"
          TEST_COUNT="${TEST_COUNT:-0}"
          
          echo "Sending callback: $STATUS, $PASSED/$TEST_COUNT passed"
          
          HTTP_CODE=$(curl -w "%{http_code}" -o response.txt \
            -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"${STATUS}\",
              \"total_tests\": ${TEST_COUNT},
              \"passed\": ${PASSED},
              \"failed\": ${FAILED},
              \"skipped\": 0,
              \"results\": []
            }")
          
          echo "HTTP Status: $HTTP_CODE"
          cat response.txt
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Callback failed"
            exit 1
          fi
          
          echo "Callback sent successfully"
